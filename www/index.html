
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1018">
<title>ZAN MUSIC</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%238ca8ff'/%3E%3Cpath d='M39 12v29a9 9 0 1 1-5-8V20l18-4v20a9 9 0 1 1-5-8V10z' fill='%2310151d'/%3E%3C/svg%3E">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap');

:root{
--bg:#0b1018;
--panel:rgba(25,34,49,.62);
--line:rgba(255,255,255,.1);
--text:#f4f6fb;
--muted:#929caf;
--blue:#8ca8ff;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:
radial-gradient(ellipse at 10% 0%,#526fbd30,transparent 40%),
radial-gradient(ellipse at 90% 30%,#54b7b030,transparent 35%),
var(--bg);
color:var(--text);
font-family:'DM Sans',sans-serif;
min-height:100vh;
overflow-x:hidden;
}

button{
font:inherit;
color:inherit;
cursor:pointer;
touch-action:manipulation;
-webkit-appearance:none;
}

.app{
max-width:1200px;
margin:auto;
padding:22px 18px 190px;
}

.brand{
font:800 22px Manrope;
margin-bottom:30px;
}

.brand span{color:#8ca8ff}

.page{display:none;animation:fade .25s ease}
.page.active{display:block}

@keyframes fade{
from{opacity:0;transform:translateY(7px)}
to{opacity:1;transform:translateY(0)}
}

h1{
font:800 30px Manrope;
margin:8px 0;
}

h3{
font:700 17px Manrope;
}

.desc{
color:var(--muted);
font-size:13px;
margin-bottom:25px;
}

.eyebrow{
font-size:10px;
letter-spacing:2px;
color:var(--blue);
font-weight:700;
}

.hero{
padding:25px;
min-height:260px;
border-radius:25px;
border:1px solid #ffffff20;
background:linear-gradient(125deg,#6179b77a,#28445d77);
position:relative;
overflow:hidden;
}

.hero:before{
content:"";
position:absolute;
pointer-events:none;
width:190px;
height:190px;
right:-30px;
top:30px;
border-radius:50%;
background:linear-gradient(140deg,#d0dcff,#738dce);
opacity:.8;
box-shadow:inset 0 0 0 15px #ffffff20;
}

.hero-content{
position:relative;
z-index:2;
max-width:70%;
}

.hero h2{
font:800 27px Manrope;
}

.hero p{
font-size:12px;
color:#dce4f5;
}

.btn{
border:0;
padding:12px 17px;
border-radius:12px;
background:#dce5ff;
color:#172238;
font-weight:700;
font-size:12px;
}

.btn-secondary{
background:#ffffff18;
color:white;
border:1px solid #ffffff30;
}

.glass{
background:var(--panel);
border:1px solid var(--line);
border-radius:20px;
padding:18px;
backdrop-filter:blur(22px) saturate(160%);
-webkit-backdrop-filter:blur(22px) saturate(160%);
}

.section{
margin-top:25px;
margin-bottom:14px;
}

.row{
display:flex;
align-items:center;
gap:12px;
margin:12px 0;
}

.cover{
width:48px;
height:48px;
flex-shrink:0;
border-radius:12px;
display:grid;
place-items:center;
background:linear-gradient(145deg,#8ca8ff,#394e80);
font-size:19px;
}

.info{
flex:1;
min-width:0;
}

.info strong{
display:block;
font-size:13px;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.info small{
color:var(--muted);
font-size:11px;
}

.icon-btn{
width:36px;
height:36px;
border:1px solid var(--line);
border-radius:50%;
background:#ffffff10;
display:grid;
place-items:center;
}

.toolbar{
display:flex;
gap:10px;
margin-bottom:15px;
}

input[type=search],input[type=text]{
min-width:0;
flex:1;
padding:13px;
border-radius:12px;
border:1px solid var(--line);
background:#ffffff0b;
color:white;
outline:none;
}

.track{
display:flex;
align-items:center;
gap:10px;
padding:11px 0;
border-bottom:1px solid #ffffff10;
}

.track .info{min-width:0}

.track-actions{
display:flex;
gap:5px;
}

.track-actions button{
width:32px;
height:32px;
border-radius:9px;
border:1px solid var(--line);
background:#ffffff0b;
}

.recommend-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.recommend{
padding:13px;
border-radius:17px;
background:var(--panel);
border:1px solid var(--line);
min-width:0;
}

.recommend .cover{
width:100%;
height:95px;
margin-bottom:10px;
}

.recommend strong{
font-size:12px;
display:block;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.recommend small{
color:var(--muted);
font-size:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.stat strong{
font:800 25px Manrope;
display:block;
margin-top:10px;
}

.stat small{
color:var(--muted);
font-size:11px;
}

.chart{
display:flex;
align-items:end;
height:140px;
gap:10px;
padding-top:15px;
}

.bar-col{
flex:1;
height:100%;
display:flex;
flex-direction:column;
justify-content:end;
align-items:center;
gap:7px;
}

.bar{
width:65%;
min-height:3px;
background:linear-gradient(#aabaff,#647fcf);
border-radius:8px 8px 2px 2px;
}

.bar-col small{
font-size:9px;
color:var(--muted);
}

/* LIQUID GLASS NAVIGATION */

.bottom-nav{
position:fixed;
z-index:1000;
bottom:18px;
left:50%;
transform:translateX(-50%);
width:min(390px,calc(100% - 28px));
display:flex;
justify-content:space-around;
align-items:center;
padding:9px;
border-radius:25px;

background:rgba(190,205,235,.09);
border:1px solid rgba(255,255,255,.23);

backdrop-filter:blur(35px) saturate(190%);
-webkit-backdrop-filter:blur(35px) saturate(190%);

box-shadow:0 12px 45px #0008;
isolation:isolate;
}

.nav-btn{
flex:1;
border:0;
background:transparent;
color:#aebbd0;
border-radius:16px;
padding:12px 5px;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
position:relative;
z-index:2;
}

.nav-btn.active{
background:linear-gradient(135deg,#cbd8ff,#8ca8ff);
color:#152039;
font-weight:800;
}

/* MUSIC PLAYER */

.player{
position:fixed;
z-index:900;
bottom:91px;
left:50%;
transform:translateX(-50%);
width:calc(100% - 26px);
max-width:600px;

background:rgba(20,29,44,.82);
border:1px solid #ffffff25;
border-radius:19px;
padding:11px;

backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

display:flex;
align-items:center;
gap:12px;
box-shadow:0 10px 35px #0007;
}

.player-info{
flex:1;
min-width:0;
}

.player-info strong{
display:block;
font-size:12px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.player-info small{
font-size:10px;
color:var(--muted);
}

.player button{
border:0;
background:transparent;
font-size:18px;
padding:7px;
}

.player .main-play{
width:37px;
height:37px;
border-radius:50%;
background:#e1e9ff;
color:#172238;
}

.progress{
position:absolute;
bottom:0;
left:15px;
right:15px;
height:3px;
background:#ffffff25;
border-radius:5px;
overflow:hidden;
}

.progress-fill{
height:100%;
width:0;
background:#9db5ff;
}

.modal{
posi.play().catch(()=>{});
}else{
audio.pause();
}

updatePlayer();
}

function nextMusic(){

if(!music.length)return;

playMusic((currentIndex+1)%music.length);
}

function previousMusic(){

if(!music.length)return;

playMusic((currentIndex-1+music.length)%music.length);
}

audio.onplay=()=>{
updatePlayer();
updateNotification();
};

audio.onpause=()=>{
updatePlayer();
updateNotification();
};

audio.onended=nextMusic;

audio.ontimeupdate=()=>{
const percent=audio.duration?
audio.currentTime/audio.duration*100:0;

document.getElementById("progressFill").style.width=percent+"%";

if("mediaSession" in navigator &&
navigator.mediaSession.setPositionState &&
Number.isFinite(audio.duration) &&
audio.duration>0){

try{
navigator.mediaSession.setPositionState({
duration:audio.duration,
playbackRate:audio.playbackRate,
position:audio.currentTime
});
}catch(e){}
}
};

function updatePlayer(){

const item=music[currentIndex];

const title=item?item.title:"Belum ada musik";
const artist=item?item.artist:"ZAN MUSIC";

document.getElementById("playerTitle").textContent=title;
document.getElementById("playerArtist").textContent=artist;

document.getElementById("heroTitle").textContent=title;
document.getElementById("heroArtist").textContent=artist;

document.getElementById("playButton").textContent=
audio.paused?"▶":"Ⅱ";

document.title=item?
title+" - "+artist+" | ZAN MUSIC":
"ZAN MUSIC";

updateNotification();
}

/* ANDROID MEDIA NOTIFICATION / LOCK SCREEN */

function updateNotification(){

if(!("mediaSession" in navigator))return;

const item=music[currentIndex];

if(!item)return;

try{

if("MediaMetadata" in window){

navigator.mediaSession.metadata=new MediaMetadata({
title:item.title,
artist:item.artist,
album:"ZAN MUSIC"
});

}

navigator.mediaSession.playbackState=
audio.paused?"paused":"playing";

}catch(e){
console.log("Media Session tidak didukung:",e);
}
}

function setupMediaSession(){

if(!("mediaSession" in navigator))return;

const actions={
play:()=>audio.play().catch(()=>{}),
pause:()=>audio.pause(),
nexttrack:()=>nextMusic(),
previoustrack:()=>previousMusic()
};

for(const [action,callback] of Object.entries(actions)){
try{
navigator.mediaSession.setActionHandler(action,callback);
}catch(e){}
}
}

/* EDIT MUSIC */

function editMusic(index){

editIndex=index;

document.getElementById("editTitle").value=music[index].title;
document.getElementById("editArtist").value=music[index].artist;

document.getElementById("editModal").classList.add("show");
}

function closeEdit(){
document.getElementById("editModal").classList.remove("show");
}

async function saveEdit(){

if(editIndex<0)return;

music[editIndex].title=
document.getElementById("editTitle").value.trim()||"Tanpa judul";

music[editIndex].artist=
document.getElementById("editArtist").value.trim()||"Artis tidak diketahui";

await saveDatabase(music[editIndex]);

closeEdit();
renderAll();
updatePlayer();
}


/* DELETE */

async function deleteMusic(index){

if(!confirm("Hapus musik ini?"))return;

const item=music[index];

if(currentIndex===index){

audio.pause();
audio.removeAttribute("src");
currentIndex=-1;

updatePlayer();

}else if(currentIndex>index){

currentIndex--;

}

if(objectURLs[index]){
URL.revokeObjectURL(objectURLs[index]);
}

await deleteDatabase(item.id);

music.splice(index,1);

objectURLs=[];

renderAll();

}

/* RENDER */

function renderPlaylist(){

const query=document.getElementById("search").value.toLowerCase();

const list=music.filter(item=>
(item.title+" "+item.artist).toLowerCase().includes(query)
);

const container=document.getElementById("musicList");

if(!list.length){
container.innerHTML='<div class="empty">Musik tidak ditemukan.</div>';
return;
}

container.innerHTML=list.map(item=>{

const index=music.indexOf(item);

return `
<div class="track">
<div class="cover">♫</div>

<div class="info">
<strong>${escapeHTML(item.title)}</strong>
<small>${escapeHTML(item.artist)}</small>
</div>

<div class="track-actions">
<button onclick="playMusic(${index})">▶</button>
<button onclick="editMusic(${index})">✎</button>
<button onclick="deleteMusic(${index})">×</button>
</div>
</div>
`;

}).join("");

}

function renderHome(){

const frequent=[...music]
.filter(x=>x.plays>0)
.sort((a,b)=>b.plays-a.plays)
.slice(0,4);

document.getElementById("frequentList").innerHTML=
frequent.length?
frequent.map(item=>`
<div class="row">
<div class="cover">♫</div>
<div class="info">
<strong>${escapeHTML(item.title)}</strong>
<small>${escapeHTML(item.artist)} · ${item.plays} kali</small>
</div>
</div>
`).join(""):
'<div class="empty">Belum ada riwayat.</div>';

const picks=[...music]
.sort((a,b)=>(b.added||0)-(a.added||0))
.slice(0,4);

document.getElementById("recommendList").innerHTML=
picks.length?
picks.map(item=>{
const index=music.indexOf(item);

return `
<div class="recommend">
<div class="cover">♫</div>
<strong>${escapeHTML(item.title)}</strong>
<small>${escapeHTML(item.artist)}</small>
<button class="btn" style="width:100%;margin-top:10px" onclick="playMusic(${index})">Putar</button>
</div>
`;

}).join(""):
'<div class="empty">Tambahkan musik terlebih dahulu.</div>';

}

function renderStats(){

const total=music.reduce((n,x)=>n+(x.plays||0),0);

const artists=new Set(music.map(x=>x.artist.toLowerCase()));

const now=new Date();

const monthly=music.reduce((total,item)=>{
return total+(item.history||[]).filter(date=>{
const d=new Date(date);
return d.getFullYear()===now.getFullYear() &&
d.getMonth()===now.getMonth();
}).length;
},0);

document.getElementById("totalPlays").textContent=total;
document.getElementById("totalMusic").textContent=music.length;
document.getElementById("totalArtists").textContent=artists.size;
document.getElementById("monthlyPlays").textContent=monthly;

const top=[...music]
.filter(x=>x.plays>0)
.sort((a,b)=>b.plays-a.plays)
.slice(0,5);

document.getElementById("topTracks").innerHTML=
top.length?top.map(x=>`
<div class="row">
<div class="cover">♫</div>
<div class="info">
<strong>${escapeHTML(x.title)}</strong>
<small>${escapeHTML(x.artist)} · ${x.plays} kali</small>
</div>
</div>
`).join(""):'<div class="empty">Belum ada data.</div>';

const days=Array.from({length:7},(_,i)=>{
const d=new Date();
d.setDate(d.getDate()-6+i);

const plays=music.reduce((total,item)=>{
return total+(item.history||[]).filter(date=>
new Date(date).toDateString()===d.toDateString()
).length;
},0);

return {
label:d.toLocaleDateString("id-ID",{weekday:"short"}),
plays
};
});

const max=Math.max(1,...days.map(x=>x.plays));

document.getElementById("chart").innerHTML=days.map(day=>`
<div class="bar-col">
<div class="bar" style="height:${Math.max(3,(day.plays/max)*100)}%"></div>
<small>${day.label}</small>
</div>
`).join("");

}

/* HTML SECURITY */

function escapeHTML(value){

return String(value).replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
})[char]);

}

/* SEARCH */

document.getElementById("search").addEventListener("input",renderPlaylist);

/* AUDIO METADATA */

audio.onloadedmetadata=async()=>{

if(currentIndex<0)return;

const item=music[currentIndex];

if(item && Number.isFinite(audio.duration)){
item.duration=audio.duration;
await saveDatabase(item);
}

};

/* START APPLICATION */

async function init(){

try{

await openDatabase();

music=await getDatabase();

objectURLs=[];

setupMediaSession();

renderAll();

}catch(error){

console.error("Database error:",error);

alert("Database gagal dibuka. Coba buka ulang aplikasi.");

}

}

init();
</script>
